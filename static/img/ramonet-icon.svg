<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="512" height="512" rx="100" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#00f0ff" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Topology Links -->
  <g stroke="#00f0ff" stroke-width="6" stroke-opacity="0.4" stroke-linecap="round">
    <line x1="120" y1="120" x2="256" y2="256"/>
    <line x1="392" y1="120" x2="256" y2="256"/>
    <line x1="120" y1="392" x2="256" y2="256"/>
    <line x1="392" y1="392" x2="256" y2="256"/>
    <line x1="120" y1="120" x2="392" y2="120" stroke-dasharray="8 8"/>
    <line x1="120" y1="392" x2="392" y2="392" stroke-dasharray="8 8"/>
  </g>

  <!-- Network Outer Nodes -->
  <circle cx="120" cy="120" r="28" fill="#0d1527" stroke="#00f0ff" stroke-width="6"/>
  <circle cx="392" cy="120" r="28" fill="#0d1527" stroke="#00f0ff" stroke-width="6"/>
  <circle cx="120" cy="392" r="28" fill="#0d1527" stroke="#00f0ff" stroke-width="6"/>
  <circle cx="392" cy="392" r="28" fill="#0d1527" stroke="#00f0ff" stroke-width="6"/>

  <!-- Center Core Router / Hub Node -->
  <circle cx="256" cy="256" r="64" fill="url(#cyan-glow)" filter="url(#neon-glow)"/>
  <circle cx="256" cy="256" r="48" fill="#060913"/>

  <!-- Stylized "R" Letterform in Center -->
  <path d="M236 216 H262 C274 216 282 224 282 234 C282 244 274 252 262 252 H248 V276 H236 Z M248 226 V242 H262 C268 242 272 238 272 234 C272 230 268 226 262 226 Z M262 252 L280 276 H294 L274 250 C284 246 290 238 290 230 C290 216 278 206 260 206 H226 V286 H248 Z" fill="#00f0ff"/>
</svg>