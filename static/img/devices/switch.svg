<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="swBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a3a55"/>
      <stop offset="100%" stop-color="#152033"/>
    </linearGradient>
    <linearGradient id="swBezel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e2c42"/>
      <stop offset="50%" stop-color="#2d4263"/>
      <stop offset="100%" stop-color="#1e2c42"/>
    </linearGradient>
    <filter id="swGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00e5ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- 1U Switch Body -->
  <rect x="6" y="28" width="88" height="44" rx="4" fill="url(#swBody)" stroke="#38bdf8" stroke-width="1.5" filter="url(#swGlow)"/>
  <!-- Top Vent Grille -->
  <line x1="12" y1="33" x2="88" y2="33" stroke="#475569" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Front Port Panel Area -->
  <rect x="10" y="38" width="80" height="28" rx="2" fill="url(#swBezel)" stroke="#0f172a" stroke-width="1"/>
  <!-- Ports (Top Row) -->
  <rect x="14" y="42" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="23" y="42" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="32" y="42" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="41" y="42" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="50" y="42" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="59" y="42" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <!-- SFP Uplink Ports -->
  <rect x="71" y="42" width="8" height="8" rx="1" fill="#0b1120" stroke="#00e5ff" stroke-width="1"/>
  <rect x="80" y="42" width="8" height="8" rx="1" fill="#0b1120" stroke="#00e5ff" stroke-width="1"/>
  <!-- Ports (Bottom Row) -->
  <rect x="14" y="52" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="23" y="52" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="32" y="52" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="41" y="52" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="50" y="52" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="59" y="52" width="7" height="6" rx="1" fill="#0b1120" stroke="#64748b" stroke-width="0.8"/>
  <rect x="71" y="54" width="8" height="8" rx="1" fill="#0b1120" stroke="#00e5ff" stroke-width="1"/>
  <rect x="80" y="54" width="8" height="8" rx="1" fill="#0b1120" stroke="#00e5ff" stroke-width="1"/>
  <!-- Green Link Status LEDs -->
  <circle cx="17.5" cy="40" r="1" fill="#22c55e"/>
  <circle cx="26.5" cy="40" r="1" fill="#22c55e"/>
  <circle cx="35.5" cy="40" r="1" fill="#22c55e"/>
  <circle cx="44.5" cy="40" r="1" fill="#22c55e"/>
  <circle cx="53.5" cy="40" r="1" fill="#22c55e"/>
  <circle cx="62.5" cy="40" r="1" fill="#ef4444"/>
  <circle cx="75" cy="39" r="1" fill="#00e5ff"/>
  <circle cx="84" cy="39" r="1" fill="#00e5ff"/>
  <!-- Power & System Indicator -->
  <circle cx="12" cy="62" r="1.5" fill="#38bdf8"/>
</svg>
