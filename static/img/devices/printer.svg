<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="printBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="40" cy="72" rx="34" ry="4" fill="rgba(0,0,0,0.35)"/>
  <!-- Top Paper Input Tray Feed -->
  <path d="M 24 12 L 56 12 L 54 26 L 26 26 Z" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1.2"/>
  <line x1="28" y1="18" x2="48" y2="18" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Main Printer Housing -->
  <rect x="10" y="24" width="60" height="38" rx="6" fill="url(#printBody)" stroke="#64748b" stroke-width="1.5"/>
  <!-- Touch Screen / Control Panel -->
  <rect x="46" y="28" width="18" height="12" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <line x1="49" y1="32" x2="60" y2="32" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <circle cx="50" cy="36" r="1.2" fill="#22c55e"/>
  <!-- Output Slot -->
  <rect x="18" y="44" width="44" height="6" rx="2" fill="#1e293b"/>
  <!-- Output Sheet Coming Out -->
  <rect x="22" y="47" width="36" height="18" rx="1.5" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="26" y1="52" x2="46" y2="52" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="26" y1="56" x2="52" y2="56" stroke="#475569" stroke-width="1" stroke-linecap="round"/>
  <line x1="26" y1="60" x2="42" y2="60" stroke="#0ea5e9" stroke-width="1" stroke-linecap="round"/>
  <!-- Ethernet / Ready Status LED -->
  <circle cx="16" cy="30" r="1.5" fill="#22c55e"/>
  <circle cx="20" cy="30" r="1.5" fill="#38bdf8"/>
</svg>