<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="rtrBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rtrAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Dual Antennas -->
  <line x1="22" y1="36" x2="16" y2="12" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="12" r="2.5" fill="#38bdf8"/>
  <line x1="78" y1="36" x2="84" y2="12" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="84" cy="12" r="2.5" fill="#38bdf8"/>
  <!-- Router Chassis -->
  <rect x="12" y="36" width="76" height="42" rx="6" fill="url(#rtrBody)" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Front Glowing Accent Strip -->
  <rect x="16" y="42" width="68" height="4" rx="2" fill="url(#rtrAccent)"/>
  <!-- Central Routing Circle Logo -->
  <circle cx="50" cy="57" r="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Cross routing arrows -->
  <line x1="45" y1="57" x2="55" y2="57" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="50" y1="52" x2="50" y2="62" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="50" cy="57" r="2" fill="#38bdf8"/>
  <!-- Status LEDs -->
  <circle cx="22" cy="68" r="1.8" fill="#22c55e"/>
  <circle cx="28" cy="68" r="1.8" fill="#22c55e"/>
  <circle cx="34" cy="68" r="1.8" fill="#38bdf8"/>
  <circle cx="40" cy="68" r="1.8" fill="#22c55e"/>
  <!-- WAN / LAN Indicators -->
  <rect x="64" y="66" width="18" height="4" rx="1" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <circle cx="68" cy="68" r="1" fill="#f59e0b"/>
  <circle cx="74" cy="68" r="1" fill="#22c55e"/>
  <circle cx="79" cy="68" r="1" fill="#22c55e"/>
</svg>
