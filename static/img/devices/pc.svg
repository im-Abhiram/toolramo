<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="monScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <!-- Monitor Outer Frame -->
  <rect x="12" y="16" width="56" height="40" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Monitor Display Screen -->
  <rect x="16" y="20" width="48" height="32" rx="1" fill="url(#monScreen)"/>
  <!-- Screen Graphic (Console Lines) -->
  <line x1="20" y1="26" x2="36" y2="26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="20" y1="31" x2="48" y2="31" stroke="#38bdf8" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="36" x2="42" y2="36" stroke="#a7f3d0" stroke-width="1" stroke-linecap="round"/>
  <circle cx="21" cy="44" r="1.5" fill="#34d399"/>
  <!-- Monitor Stand -->
  <rect x="36" y="56" width="8" height="10" fill="#334155"/>
  <rect x="28" y="66" width="24" height="3" rx="1.5" fill="#475569"/>
  <!-- Keyboard -->
  <polygon points="14,76 66,76 62,83 18,83" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <line x1="22" y1="79" x2="58" y2="79" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2,2"/>
  <!-- Desktop Tower (PC) -->
  <rect x="72" y="22" width="18" height="52" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Tower Power Button -->
  <circle cx="81" cy="28" r="2.5" fill="#38bdf8"/>
  <!-- Optical / Bay Slits -->
  <line x1="76" y1="36" x2="86" y2="36" stroke="#334155" stroke-width="1"/>
  <line x1="76" y1="40" x2="86" y2="40" stroke="#334155" stroke-width="1"/>
  <!-- USB Ports -->
  <rect x="76" y="46" width="4" height="2" fill="#38bdf8"/>
  <rect x="82" y="46" width="4" height="2" fill="#38bdf8"/>
  <!-- Bottom Tower Grille -->
  <line x1="76" y1="58" x2="86" y2="58" stroke="#475569" stroke-width="1" stroke-dasharray="1,1"/>
  <line x1="76" y1="62" x2="86" y2="62" stroke="#475569" stroke-width="1" stroke-dasharray="1,1"/>
  <line x1="76" y1="66" x2="86" y2="66" stroke="#475569" stroke-width="1" stroke-dasharray="1,1"/>
</svg>
