<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="nvrChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="panelGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Drop Shadow -->
  <ellipse cx="40" cy="70" rx="34" ry="4" fill="rgba(0,0,0,0.5)"/>
  <!-- Main NVR Appliance Chassis -->
  <rect x="8" y="24" width="64" height="42" rx="4" fill="url(#nvrChassis)" stroke="#475569" stroke-width="1.8"/>
  <!-- Front Bezel Recess -->
  <rect x="11" y="27" width="58" height="36" rx="2" fill="url(#panelGloss)" stroke="#334155" stroke-width="1"/>
  <!-- 4-Bay HDD Hot-Swap Trays -->
  <rect x="14" y="30" width="28" height="6.5" rx="1.5" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
  <line x1="36" y1="33" x2="40" y2="33" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14" y="38" width="28" height="6.5" rx="1.5" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
  <line x1="36" y1="41" x2="40" y2="41" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14" y="46" width="28" height="6.5" rx="1.5" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
  <line x1="36" y1="49" x2="40" y2="49" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="14" y="54" width="28" height="6.5" rx="1.5" fill="#0f172a" stroke="#64748b" stroke-width="0.8"/>
  <line x1="36" y1="57" x2="40" y2="57" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- CCTV Video Stream Matrix Screen Preview -->
  <rect x="46" y="30" width="20" height="18" rx="2" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
  <!-- 4 Split Screen Channels -->
  <rect x="47.5" y="31.5" width="8" height="7" fill="#0f172a"/>
  <circle cx="51.5" cy="35" r="1.5" fill="#0284c7"/>
  <rect x="56.5" y="31.5" width="8" height="7" fill="#0f172a"/>
  <circle cx="60.5" cy="35" r="1.5" fill="#0284c7"/>
  <rect x="47.5" y="39.5" width="8" height="7" fill="#0f172a"/>
  <circle cx="51.5" cy="43" r="1.5" fill="#0284c7"/>
  <rect x="56.5" y="39.5" width="8" height="7" fill="#0f172a"/>
  <circle cx="60.5" cy="43" r="1.5" fill="#0284c7"/>
  <!-- LED Status Bank (Power, REC, Net, Alarm) -->
  <circle cx="48" cy="54" r="1.5" fill="#22c55e"/>
  <circle cx="53" cy="54" r="1.5" fill="#ef4444"/>
  <circle cx="58" cy="54" r="1.5" fill="#38bdf8"/>
  <circle cx="63" cy="54" r="1.5" fill="#eab308"/>
  <!-- USB Backup Port -->
  <rect x="50" y="58" width="5" height="2.5" fill="#94a3b8"/>
  <rect x="58" y="58" width="5" height="2.5" fill="#94a3b8"/>
</svg>