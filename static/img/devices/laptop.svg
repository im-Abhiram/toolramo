<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="laptopBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="laptopScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="baseGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Drop Shadow -->
  <ellipse cx="40" cy="71" rx="34" ry="4" fill="rgba(0,0,0,0.4)"/>
  <!-- Screen Lid Outer -->
  <rect x="15" y="14" width="50" height="38" rx="4" fill="url(#laptopBody)" stroke="#475569" stroke-width="1.5"/>
  <!-- Screen Bezel / Display -->
  <rect x="18" y="17" width="44" height="32" rx="2" fill="url(#laptopScreen)"/>
  <!-- Screen Content Lines -->
  <line x1="22" y1="23" x2="36" y2="23" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="28" x2="48" y2="28" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="33" x2="42" y2="33" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- Small Screen Chart -->
  <polyline points="22,43 28,39 35,42 43,36 50,40 56,35" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Webcam Dot -->
  <circle cx="40" cy="15.5" r="0.8" fill="#94a3b8"/>
  <!-- Hinge / Lower Base -->
  <path d="M 6 56 L 74 56 L 68 67 C 68 68.5 66.5 69 64 69 L 16 69 C 13.5 69 12 68.5 12 67 Z" fill="url(#baseGlow)" stroke="#475569" stroke-width="1.2"/>
  <!-- Trackpad -->
  <rect x="33" y="60" width="14" height="6.5" rx="1.5" fill="#1e293b" stroke="#475569" stroke-width="0.8"/>
  <!-- Keyboard Indicator Bar -->
  <line x1="18" y1="58" x2="62" y2="58" stroke="#1e293b" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Wi-Fi Status LED -->
  <circle cx="63" cy="64" r="1.2" fill="#22c55e"/>
</svg>