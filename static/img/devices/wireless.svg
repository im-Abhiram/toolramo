<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <defs>
    <linearGradient id="apBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="waveGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="40" cy="70" rx="30" ry="5" fill="rgba(0,0,0,0.35)"/>
  <!-- Dual Antennas -->
  <line x1="24" y1="40" x2="16" y2="12" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="12" r="2.5" fill="#0ea5e9"/>
  <line x1="56" y1="40" x2="64" y2="12" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="12" r="2.5" fill="#0ea5e9"/>
  <!-- AP Dome Body -->
  <rect x="14" y="38" width="52" height="28" rx="8" fill="url(#apBody)" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Center Status Ring / Emblem -->
  <circle cx="40" cy="52" r="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Wi-Fi Symbol on AP -->
  <path d="M 34 50 A 8 8 0 0 1 46 50" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 37 53 A 4 4 0 0 1 43 53" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="40" cy="55.5" r="1.2" fill="#22c55e"/>
  <!-- LED Indicators (Power, 2.4GHz, 5GHz, LAN) -->
  <circle cx="22" cy="46" r="1.5" fill="#22c55e"/>
  <circle cx="26" cy="46" r="1.5" fill="#38bdf8"/>
  <circle cx="30" cy="46" r="1.5" fill="#818cf8"/>
  <circle cx="58" cy="46" r="1.5" fill="#22c55e"/>
  <!-- Radiating Wi-Fi Waves -->
  <path d="M 28 24 A 18 18 0 0 1 52 24" fill="none" stroke="url(#waveGlow)" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
  <path d="M 22 17 A 26 26 0 0 1 58 17" fill="none" stroke="url(#waveGlow)" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 16 10 A 34 34 0 0 1 64 10" fill="none" stroke="url(#waveGlow)" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
</svg>